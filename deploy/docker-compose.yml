version: "3.9"

services:
  app:
    build: ..
    container_name: taller-conecta-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_MODE=demo
      - AUTH_SECRET=${AUTH_SECRET}
    volumes:
      - app_data:/app/.data
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: taller-conecta-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: taller-conecta-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - web

volumes:
  app_data:
  certbot_certs:
  certbot_www:

networks:
  web:
    driver: bridge
